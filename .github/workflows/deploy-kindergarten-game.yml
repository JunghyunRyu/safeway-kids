name: Deploy 유치원 등원 game (Pages)

# games/kindergarten-dropoff (Vite) 를 빌드해 GitHub Pages 로 배포한다.
# 사전 1회 설정: repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/kindergarten-dropoff-game-uMHsg
    paths:
      - "games/kindergarten-dropoff/**"
      - ".github/workflows/deploy-kindergarten-game.yml"
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건으로 제한 (진행 중 배포는 취소하지 않음)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/kindergarten-dropoff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games/kindergarten-dropoff/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # repo의 Pages 를 GitHub Actions 소스로 자동 활성화 시도
          # (GITHUB_TOKEN 에 pages:write 권한이 있어 수동 설정 없이 켜짐)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/kindergarten-dropoff/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
